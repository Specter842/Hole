# Render blueprint. `render.yaml` in the repo root; point a new Blueprint at it.
#
# Two things must be set before this is safe to deploy:
#
#   JOBSEARCH_PASSWORD  any long random string. Without it the server refuses to
#                       bind publicly, because this dashboard shows your address,
#                       phone number, and employment history, and can send
#                       applications.
#   JOBSEARCH_HOST      the hostname Render gives you, e.g. jobsearch.onrender.com.
#                       The DNS-rebinding check compares against it.
#
# Note the disk: SQLite needs a real filesystem, and Render's default one is
# wiped on every deploy. Without this mount your data does not survive a push.
services:
  - type: web
    name: jobsearch
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: python -m jobsearch web --host 0.0.0.0 --port $PORT --no-browser
    healthCheckPath: /
    disk:
      name: jobsearch-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JOBSEARCH_DB
        value: /var/data/jobsearch.db
      - key: JOBSEARCH_PASSWORD
        generateValue: true
      - key: JOBSEARCH_HOST
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
